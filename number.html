<!DOCTYPE html>
<html>
<head>
  <title>tc/tag numberpredict</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(28, 16px);
      grid-template-rows: repeat(28, 16px);
      gap: 1px;
      margin-bottom: 15px;
      user-select: none;
    }
    .cell {
      width: 16px;
      height: 16px;
      background-color: white;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    .cell.on {
      background-color: black;
    }
    button {
      margin-right: 10px;
      margin-bottom: 10px;
    }
    pre {
      background: #f2f2f2;
      padding: 10px;
      font-size: 14px;
      border-radius: 4px;
      max-width: 90vw;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

<h2>Draw a Digit (tc/tag numberpredict)</h2>
<p>Click and drag on the grid to draw. Then press "Get Vector" to see the compressed 10-number representation.</p>
<p>(For best results, avoid the edges of the canvas and draw like you would in handwriting)</p>

<div id="grid"></div>

<button onclick="computePCA()">Get Vector</button>
<button onclick="clearGrid()">Clear</button>

<pre id="output">Click and drag on the grid to begin drawing.</pre>
  <script>
  const size = 28;
  const grid = document.getElementById("grid");
  const output = document.getElementById("output");
  let cells = [];
  let drawing = false;

  function getCellFromTouch(touch) {
    const element = document.elementFromPoint(touch.clientX, touch.clientY);
    if (element && element.classList.contains("cell")) {
      return parseInt(element.dataset.index);
    }
    return null;
  }

  // Build 28x28 grid
  for (let i = 0; i < size * size; i++) {
    const cell = document.createElement("div");
    cell.classList.add("cell");
    cell.dataset.index = i;

    cell.addEventListener("mousedown", (e) => {
      drawing = true;
      turnOnNeighbors(parseInt(cell.dataset.index));
    });
    cell.addEventListener("mouseover", () => {
      if (drawing) {
        turnOnNeighbors(parseInt(cell.dataset.index));
      }
    });
    cell.addEventListener("mouseup", () => {
      drawing = false;
    });

    grid.appendChild(cell);
    cells.push(cell);
  }

  // Mouse release outside grid
  document.body.addEventListener("mouseup", () => {
    drawing = false;
  });

  // TOUCH SUPPORT
  grid.addEventListener("touchstart", (e) => {
    drawing = true;
    e.preventDefault(); // prevent scrolling
    const touch = e.touches[0];
    const index = getCellFromTouch(touch);
    if (index !== null) {
      turnOnNeighbors(index);
    }
  }, { passive: false });

  grid.addEventListener("touchmove", (e) => {
    if (!drawing) return;
    e.preventDefault(); // prevent scrolling
    const touch = e.touches[0];
    const index = getCellFromTouch(touch);
    if (index !== null) {
      turnOnNeighbors(index);
    }
  }, { passive: false });

  grid.addEventListener("touchend", () => {
    drawing = false;
  });

  function turnOnNeighbors(index) {
    const row = Math.floor(index / size);
    const col = index % size;

    const neighbors = [
      [row, col],         // center
      [row - 1, col],     // up
      [row - 1, col - 1], // up-left
      [row, col - 1]      // left
    ];

    neighbors.forEach(([r, c]) => {
      if (r >= 0 && r < size && c >= 0 && c < size) {
        const i = r * size + c;
        cells[i].classList.add("on");
      }
    });
  }

  function applyPCATransform(flatInput) {
    if (PCA_COMPONENTS.length === 0 || PCA_MEAN.length === 0) {
      output.textContent = "Please paste PCA_COMPONENTS and PCA_MEAN data into the script.";
      return null;
    }

    const centered = flatInput.map((val, i) => val - PCA_MEAN[i]);
    const transformed = PCA_COMPONENTS.map(component =>
      component.reduce((sum, weight, i) => sum + weight * centered[i], 0)
    );
    return transformed;
  }

  function computePCA() {
    // Build flat array of 0/1 for grid pixels
    const flatInput = cells.map(cell => cell.classList.contains("on") ? 1 : 0);

    const pcaVector = applyPCATransform(flatInput);
    if (pcaVector === null) return;

    output.textContent = "tc/tag numberpredict " + pcaVector.map(n => n.toFixed(5)).join(" ");
  }

  function clearGrid() {
    cells.forEach(cell => cell.classList.remove("on"));
    output.textContent = "Grid cleared.";
  }
